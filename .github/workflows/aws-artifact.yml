name: AWS Lambda artifact
on:
  workflow_dispatch:
  pull_request:
    paths: ['apps/api/**', 'scripts/build-lambda.sh', '.github/workflows/aws-artifact.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/build-lambda.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-arm64
          path: build/api.zip
