[package]
name = "lilac-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
async-graphql = { version = "=7.0.17", features = ["chrono", "uuid"] }
async-graphql-derive = "=7.0.17"
async-graphql-parser = "=7.0.17"
async-graphql-value = "=7.0.17"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
openidconnect = { version = "4.1", default-features = false, features = ["reqwest", "rustls-tls"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["limit", "trace"] }
