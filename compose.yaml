services:
  db:
    image: amazon/dynamodb-local:3.1.0
    command: '-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data'
    user: root
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - dynamodb_data:/home/dynamodblocal/data
  init-db:
    image: amazon/aws-cli:2.27.49
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: ap-southeast-1
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until aws dynamodb list-tables --endpoint-url http://db:8000 >/dev/null 2>&1; do sleep 1; done
        aws dynamodb describe-table --table-name tingting-local --endpoint-url http://db:8000 >/dev/null 2>&1 || aws dynamodb create-table --table-name tingting-local --attribute-definitions AttributeName=pk,AttributeType=S AttributeName=sk,AttributeType=S --key-schema AttributeName=pk,KeyType=HASH AttributeName=sk,KeyType=RANGE --billing-mode PAY_PER_REQUEST --endpoint-url http://db:8000
    depends_on:
      - db
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DYNAMODB_TABLE: tingting-local
      DYNAMODB_ENDPOINT: http://db:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: ap-southeast-1
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      OPEN_GROUP_CREATION: ${OPEN_GROUP_CREATION:-true}
      RUST_LOG: tingting_api=info,tower_http=info
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      init-db:
        condition: service_completed_successfully
volumes:
  dynamodb_data:
